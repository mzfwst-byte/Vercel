<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bearing Lines Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}
#map {
  width: 100%;
  height: 100%;
}
#info {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  background: rgba(0, 0, 0, 0.7);
  color: #00ff00;
  font-size: 12px;
  padding: 6px;
  z-index: 1000;
  line-height: 1.4;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="info">
Fixed Center<br>
Lat: 35.67797599475285<br>
Lon: 139.66690577010075<br>
Bearings: 250° (red), 200° (blue)<br>
Distance: 10 km
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ===== Fixed center coordinates =====
const centerLat = 35.67797599475285;
const centerLon = 139.66690577010075;

// ===== Initialize map (movable) =====
const map = L.map("map").setView([centerLat, centerLon], 14);

// ===== GSI (Geospatial Information Authority of Japan) tiles =====
L.tileLayer(
  "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
  {
    attribution: "GSI Japan",
    maxZoom: 18
  }
).addTo(map);

// ===== Center marker =====
L.marker([centerLat, centerLon])
  .addTo(map)
  .bindPopup("Fixed Center")
  .openPopup();

// ===== Function to draw bearing line =====
function drawBearingLine(bearingDeg, color) {
  const R = 6378137;       // Earth radius (meters)
  const distance = 15000; // 15 km
  const rad = Math.PI / 180;

  const lat1 = centerLat * rad;
  const lon1 = centerLon * rad;
  const brng = bearingDeg * rad;

  const lat2 = Math.asin(
    Math.sin(lat1) * Math.cos(distance / R) +
    Math.cos(lat1) * Math.sin(distance / R) * Math.cos(brng)
  );

  const lon2 = lon1 + Math.atan2(
    Math.sin(brng) * Math.sin(distance / R) * Math.cos(lat1),
    Math.cos(distance / R) - Math.sin(lat1) * Math.sin(lat2)
  );

  L.polyline(
    [
      [centerLat, centerLon],
      [lat2 / rad, lon2 / rad]
    ],
    {
      color: color,
      weight: 3
    }
  ).addTo(map);
}

// ===== Draw bearings =====
drawBearingLine(250, "red");   // South-South-West (250°)
drawBearingLine(200, "blue");  // West-South-West (200°)
</script>

</body>
</html>
